<meta name="theme-color" content="#0C1611" />
<meta name="color-scheme" content="light dark" />
<meta name="author" content="Regena Systems Africa Ltd" />
<link rel="icon" type="image/png" href="assets/regena-logo.png" />
<link rel="apple-touch-icon" href="assets/regena-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/styles.css" />
<script>
  (function () {
    document.documentElement.classList.add("js");
    try {
      // Dark is the default; only honour an explicit saved "light" choice.
      if (localStorage.getItem("regena-theme") !== "light") document.documentElement.classList.add("dark");
    } catch (e) { document.documentElement.classList.add("dark"); }
  })();
</script>
