<meta name="theme-color" content="#FAFCFA" />
<meta name="color-scheme" content="light dark" />
<meta name="author" content="Regena Systems Africa Ltd" />
<meta property="og:site_name" content="Regena Systems Africa" />
<link rel="icon" type="image/png" href="assets/regena-logo.png" />
<link rel="apple-touch-icon" href="assets/regena-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind.config.js"></script>
<link rel="stylesheet" href="assets/styles.css" />
<script>
  (function () {
    document.documentElement.classList.add("js");
    try {
      // Light is the default; only honour an explicit saved "dark" choice.
      if (localStorage.getItem("regena-theme") === "dark") document.documentElement.classList.add("dark");
    } catch (e) {}
  })();
</script>
