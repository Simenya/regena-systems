<dialog id="partner-dialog" aria-labelledby="partner-dialog-title">
  <div class="dialog-panel">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="eyebrow">Partner with us</p>
        <h2 id="partner-dialog-title" class="font-display text-2xl font-bold text-ink mt-2 tracking-tight">Let's work together</h2>
        <p class="soft mt-2">Tell us how you would like to partner. We reply personally with the next steps. To give, <a href="donate.html" class="text-primary font-medium underline underline-offset-4">go to the donate page</a>.</p>
      </div>
      <button type="button" data-close-dialog aria-label="Close" class="h-9 w-9 shrink-0 grid place-items-center rounded-xl border border-line/15 text-ink hover:bg-primary/10">
        <span data-icon="close" class="h-5 w-5"></span>
      </button>
    </div>
    <div class="mt-6">
      {{partner-form}}
    </div>
  </div>
</dialog>
