<dialog id="partner-dialog" aria-labelledby="partner-dialog-title">
  <div class="dialog-panel">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="eyebrow">Work with us</p>
        <h2 id="partner-dialog-title" class="font-display text-2xl font-bold text-ink mt-2 tracking-tight">Tell us who you are and what you have in mind</h2>
        <p class="soft mt-2">We reply personally within five working days with next steps, or an invitation to visit Nakifuuma.</p>
      </div>
      <button type="button" data-close-dialog aria-label="Close" class="h-9 w-9 shrink-0 grid place-items-center rounded-xl border border-line/15 text-ink hover:bg-primary/10">
        <span data-icon="close" class="h-5 w-5"></span>
      </button>
    </div>
    <div class="mt-6">
      {{enquiry-form}}
    </div>
  </div>
</dialog>
